name: Generate Snake Animation
on:
  schedule:
    # Runs once a day at 00:00 UTC. GitHub may delay scheduled runs slightly
    # under load -- that's normal and harmless here.
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate black/red snake animation
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # One output per line. color_dots goes from "0 contributions" to
          # "highest contributions" (exactly 5 colors), color_snake is the
          # snake body -- black/red theme.
          outputs: |
            dist/github-snake.svg?color_snake=#c81e1e&color_dots=#ffe5e5,#ffb3b3,#ff6b6b,#e63946,#a4161a
            dist/github-snake-dark.svg?color_snake=#ff3b3b&color_dots=#1a0505,#4d0f0f,#8a1c1c,#c81e1e,#ff3b3b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the "output" branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation [skip ci]"
